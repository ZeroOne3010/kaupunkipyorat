<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helsinki city-bike flows</title>
  <link href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="map" aria-label="Map of Helsinki city-bike trips"></div>

  <aside id="station-summary" class="summary" aria-labelledby="station" hidden>
    <div class="summary-heading">
      <div><span class="eyebrow">Station summary</span><h2 id="station">Station</h2></div>
      <button id="clear" class="icon-button" type="button" aria-label="Close station summary">×</button>
    </div>
    <p id="rides">—</p>
    <div class="summary-columns">
      <section><h3>Top destinations</h3><ol id="top-outgoing"></ol></section>
      <section><h3>Top origins</h3><ol id="top-incoming"></ol></section>
    </div>
  </aside>

  <section class="panel" aria-label="Map controls">
    <header class="panel-heading">
      <div class="panel-title"><span class="eyebrow">Helsinki</span><h1>City-bike flows</h1></div>
      <p id="collapsed-status" aria-hidden="true">Loading data…</p>
      <button id="toggle-controls" class="icon-button" type="button" aria-expanded="true" aria-controls="controls-body" aria-label="Collapse map controls">⌄</button>
    </header>
    <div id="controls-body">
      <div class="control-grid">
        <fieldset class="segments mode-control"><legend class="visually-hidden">Period</legend>
          <label><input type="radio" name="mode" value="month" checked> Month</label>
          <label><input type="radio" name="mode" value="day"> Day</label>
          <label><input type="radio" name="mode" value="hour"> Hour</label>
        </fieldset>
        <p id="period-label" class="period-label">Loading data…</p>
        <div class="time-navigation" role="group" aria-label="Change selected date and time">
          <button type="button" data-step="-1" data-unit="month" aria-label="Previous available month">−1M</button>
          <button type="button" data-step="-1" data-unit="day" aria-label="Previous day">−1d</button>
          <button type="button" data-step="-1" data-unit="hour" aria-label="Previous hour">−1h</button>
          <span class="navigation-gap" aria-hidden="true"></span>
          <button type="button" data-step="1" data-unit="hour" aria-label="Next hour">+1h</button>
          <button type="button" data-step="1" data-unit="day" aria-label="Next day">+1d</button>
          <button type="button" data-step="1" data-unit="month" aria-label="Next available month">+1M</button>
        </div>
        <div class="filter-row">
          <fieldset class="segments direction-control"><legend class="visually-hidden">Direction</legend>
            <label><input type="radio" name="direction" value="outgoing"> Outgoing</label>
            <label><input type="radio" name="direction" value="both" checked> Both</label>
            <label><input type="radio" name="direction" value="incoming"> Incoming</label>
          </fieldset>
          <label class="threshold"><span aria-label="Minimum trips">≥</span><input id="threshold" type="number" min="1" step="1" value="5" inputmode="numeric" aria-label="Minimum trips"></label>
        </div>
      </div>
      <p id="all-rides" class="status">—</p>
      <p id="data-notice" class="data-notice" role="status" aria-live="polite"></p>
      <p class="hint">Select a station for its busiest origins and destinations.</p>
    </div>
  </section>
  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
  <script src="stations.js"></script>
  <script src="time-navigation.js"></script>
  <script src="app.js"></script>
</body>
</html>

name: Build estimated cycling corridors

on:
  workflow_dispatch:
    inputs:
      year:
        description: Complete April–October city-bike season
        required: true
        default: "2025"
        type: string
      tolerance_meters:
        description: Maximum geometric conflation distance in metres
        required: true
        default: "4"
        type: string
      minimum_trips:
        description: Minimum seasonal trips for an OD route
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  corridors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependencies
        run: python -m pip install --disable-pip-version-check shapely pyproj
      - name: Build inferred season corridors
        env:
          YEAR: ${{ inputs.year }}
          TOLERANCE: ${{ inputs.tolerance_meters }}
          MINIMUM: ${{ inputs.minimum_trips }}
        run: |
          [[ "$YEAR" =~ ^[0-9]{4}$ ]] || { echo "year must contain four digits" >&2; exit 1; }
          python preprocess/build-corridors.py "$YEAR" \
            --tolerance-meters "$TOLERANCE" --minimum-trips "$MINIMUM" \
            --output "output/$YEAR.json" --report "output/$YEAR-summary.txt"
      - name: Validate compact corridor JSON
        env:
          YEAR: ${{ inputs.year }}
        run: |
          python -m json.tool "output/$YEAR.json" >/dev/null
          python - "$YEAR" <<'PY'
          import json, pathlib, sys
          year = int(sys.argv[1])
          data = json.loads((pathlib.Path("output") / f"{year}.json").read_text())
          assert data["v"] == 1 and data["year"] == year
          assert data["from"] == f"{year}-04" and data["to"] == f"{year}-10"
          assert all(isinstance(row, list) and len(row) == 2 and isinstance(row[0], str)
                     and isinstance(row[1], int) and row[1] >= 0 for row in data["corridors"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: estimated-cycling-corridors-${{ inputs.year }}
          path: |
            output/${{ inputs.year }}.json
            output/${{ inputs.year }}-summary.txt
          if-no-files-found: error

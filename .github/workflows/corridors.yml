name: Build estimated cycling corridors

on:
  workflow_dispatch:
    inputs:
      year:
        description: Complete April–October city-bike season
        required: true
        default: "2025"
        type: string
      minimum_trips:
        description: Minimum seasonal trips for an OD route
        required: true
        default: "1"
        type: string
      max_routes:
        description: Optional diagnostic limit on routed OD records (empty means unlimited)
        required: false
        default: ""
        type: string
      sample_routes:
        description: Optional evenly distributed diagnostic sample of routed OD records
        required: false
        default: ""
        type: string
      exact_edges_only:
        description: Only measure exact primitive-edge collapse (no corridor JSON)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  corridors:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test corridor preprocessing
        run: python -m unittest preprocess/test_build_corridors.py
      - name: Build inferred season corridors
        env:
          YEAR: ${{ inputs.year }}
          MINIMUM: ${{ inputs.minimum_trips }}
          MAX_ROUTES: ${{ inputs.max_routes }}
          SAMPLE_ROUTES: ${{ inputs.sample_routes }}
          EXACT_EDGES_ONLY: ${{ inputs.exact_edges_only }}
        run: |
          [[ "$YEAR" =~ ^[0-9]{4}$ ]] || { echo "year must contain four digits" >&2; exit 1; }
          MAX_ROUTES_ARGUMENT=()
          SAMPLE_ROUTES_ARGUMENT=()
          EXACT_EDGES_ARGUMENT=()
          if [[ -n "$MAX_ROUTES" ]]; then
            [[ "$MAX_ROUTES" =~ ^[1-9][0-9]*$ ]] || { echo "max_routes must be empty or a positive integer" >&2; exit 1; }
            MAX_ROUTES_ARGUMENT=(--max-routes "$MAX_ROUTES")
          fi
          if [[ -n "$SAMPLE_ROUTES" ]]; then
            [[ "$SAMPLE_ROUTES" =~ ^[1-9][0-9]*$ ]] || { echo "sample_routes must be empty or a positive integer" >&2; exit 1; }
            SAMPLE_ROUTES_ARGUMENT=(--sample-routes "$SAMPLE_ROUTES")
          fi
          [[ -z "$MAX_ROUTES" || -z "$SAMPLE_ROUTES" ]] || { echo "max_routes and sample_routes cannot both be supplied" >&2; exit 1; }
          if [[ "$EXACT_EDGES_ONLY" == "true" ]]; then
            EXACT_EDGES_ARGUMENT=(--exact-edges-only --exact-edges-summary "output/$YEAR-exact-edges-summary.json")
          fi
          python preprocess/build-corridors.py "$YEAR" \
            --minimum-trips "$MINIMUM" \
            "${MAX_ROUTES_ARGUMENT[@]}" "${SAMPLE_ROUTES_ARGUMENT[@]}" \
            "${EXACT_EDGES_ARGUMENT[@]}" \
            --output "output/$YEAR.json" --report "output/$YEAR-summary.txt"
      - name: Validate compact corridor JSON
        if: ${{ !inputs.exact_edges_only }}
        env:
          YEAR: ${{ inputs.year }}
        run: |
          python -m json.tool "output/$YEAR.json" >/dev/null
          python - "$YEAR" <<'PY'
          import json, pathlib, sys
          year = int(sys.argv[1])
          data = json.loads((pathlib.Path("output") / f"{year}.json").read_text())
          assert data["v"] == 1 and data["year"] == year
          assert data["from"] == f"{year}-04" and data["to"] == f"{year}-10"
          assert all(isinstance(row, list) and len(row) == 2 and isinstance(row[0], str)
                     and isinstance(row[1], int) and row[1] >= 0 for row in data["corridors"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: estimated-cycling-corridors-${{ inputs.year }}
          path: |
            output/${{ inputs.year }}.json
            output/${{ inputs.year }}-summary.txt
            output/${{ inputs.year }}-exact-edges-summary.json
          if-no-files-found: error

name: Build station metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch stations and build JavaScript
        env:
          DIGITRANSIT_SUBSCRIPTION_KEY: ${{ secrets.DIGITRANSIT_SUBSCRIPTION_KEY }}
        run: python preprocess/build-stations.py output/stations.js
      - name: Validate generated JavaScript
        run: |
          test -s output/stations.js
          node --check output/stations.js
      - uses: actions/upload-artifact@v4
        with:
          name: hsl-city-bike-stations
          path: output/stations.js
          if-no-files-found: error

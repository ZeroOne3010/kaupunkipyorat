name: Build monthly data

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: URL of an HSL CSV or ZIP containing one or more monthly CSV files
        required: true
        type: string
      output_filename:
        description: Optional JSON filename when the source contains exactly one CSV; otherwise each file is named YYYY-MM.json
        required: false
        type: string
      output_type:
        description: Files to generate
        required: true
        default: both
        type: choice
        options:
          - both
          - aggregate
          - insights

permissions:
  contents: read

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate optional output filename
        env:
          REQUESTED_OUTPUT_FILENAME: ${{ inputs.output_filename }}
        run: |
          OUTPUT_FILENAME="$REQUESTED_OUTPUT_FILENAME"
          [[ -z "$OUTPUT_FILENAME" ]] && exit 0
          [[ "$OUTPUT_FILENAME" =~ ^[A-Za-z0-9._-]+\.json$ ]] || {
            echo "Output filename must be a plain .json filename" >&2
            exit 1
          }
          [[ "$OUTPUT_FILENAME" != "months.json" && "$OUTPUT_FILENAME" != "sample-month.json" ]] || {
            echo "Output filename '$OUTPUT_FILENAME' is reserved by the site" >&2
            exit 1
          }
      - name: Download source data
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: curl --fail --location --retry 3 --output /tmp/hsl-month "$SOURCE_URL"
      - name: Build compact JSON
        env:
          OUTPUT_FILENAME: ${{ inputs.output_filename }}
        run: |
          args=()
          [[ -n "$OUTPUT_FILENAME" ]] && args+=(--output-filename "$OUTPUT_FILENAME")
          if [[ "${{ inputs.output_type }}" != "insights" ]]; then
            python preprocess/build-data-batch.py /tmp/hsl-month output "${args[@]}"
          fi
          if [[ "${{ inputs.output_type }}" != "aggregate" ]]; then
            python preprocess/build-data-batch.py /tmp/hsl-month output/records --kind records "${args[@]}"
          fi
      - name: Sanity-check output
        run: |
          python - <<'PY'
          import json, pathlib
          files = sorted(pathlib.Path("output").rglob("*.json"))
          assert files, "no JSON files were generated"
          for path in files:
              data = json.loads(path.read_text())
              assert data["v"] == 1 and 1 <= data["m"] <= 12
              if "total" in data:
                  assert data["total"] and sum(row[2] for row in data["total"]) > 0
                  assert len(data["d"]) in (28, 29, 30, 31)
                  assert len(data["h"]) == len(data["d"]) * 24
              else:
                  assert all({"origin", "destination", "durationS", "distanceM"} <= set(ride) for ride in list(data.values())[3:])
              print(f"{path}: JSON structure is valid")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hsl-city-bike-json
          path: output
          if-no-files-found: error
